<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Info</title>
    <!-- ...existing code... -->
<script>
    async function sendDeviceInfo() {
        const device = navigator.userAgent; // Get device information
        let location = "Unknown";

        // Get location information
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                location = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                };

                // Send data to the server
                const response = await fetch('/submit_device_info', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ device, location })
                });
            });
        }
    }

    // Call the function when the page loads
    window.onload = sendDeviceInfo;
</script>
<!-- ...existing code... -->
</head>
<body>
    <form action="/submit_user_info" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
        <br>
        <button type="submit">Submit</button>
    </form>
    <!-- Example snippet for index.html -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}  
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}
</body>
</html>
